name: CyclingCompanion
options:
  bundleIdPrefix: com.cyclingcompanion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  RoutePersistence:
    path: Packages/RoutePersistence

targets:
  CyclingCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CyclingCompanion
    dependencies:
      - package: RoutePersistence
    info:
      path: Sources/CyclingCompanion/App/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Cycling Companion uses your location to track your ride against the planned route."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Cycling Companion uses your location in the background to keep tracking your ride while your phone is pocketed or mounted."
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyclingcompanion.app
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - CyclingCompanionTests
      commandLineArguments: {}

  CyclingCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CyclingCompanionTests
    dependencies:
      - target: CyclingCompanion
      - package: RoutePersistence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
