name: CyclingCompanion
# Beta is Release plus Demo Mode, for TestFlight. Release (the App Store build) has no Demo Mode.
configs:
  Debug: debug
  Beta: release
  Release: release
options:
  bundleIdPrefix: site.cyclecomp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RoutePersistence:
    path: Packages/RoutePersistence

targets:
  CyclingCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CyclingCompanion
    dependencies:
      - package: RoutePersistence
    info:
      path: Sources/CyclingCompanion/App/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Cycling Rest Companion"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        CyclingCompanionBackendBaseURL: "$(CC_BACKEND_BASE_URL)"
        CyclingCompanionDemoAccessToken: "$(CC_DEMO_ACCESS_TOKEN)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Cycling Rest Companion uses your location to track your ride against the planned route."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Cycling Rest Companion uses your location in the background to keep tracking your ride while your phone is pocketed or mounted."
        NSBluetoothAlwaysUsageDescription: "Cycling Rest Companion connects to your heart rate and cadence sensors to read them during your ride."
        UIBackgroundModes:
          - location
          - bluetooth-central
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: site.cyclecomp.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEMO_MODE"
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEMO_MODE"
    configFiles:
      Debug: Config/Backend.xcconfig
      Beta: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    scheme:
      testTargets:
        - CyclingCompanionTests
        - CyclingCompanionUITests
      commandLineArguments: {}

  CyclingCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CyclingCompanionTests
    dependencies:
      - target: CyclingCompanion
      - package: RoutePersistence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  CyclingCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/CyclingCompanionUITests
    dependencies:
      - target: CyclingCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
