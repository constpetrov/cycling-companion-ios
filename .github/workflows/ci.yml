name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # AC-47 in spec/criteria.md: unit and simulator E2E suites via xcodebuild test on
    # GitHub-hosted macOS runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select simulator destination
        id: destination
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^[[:space:]]*([^(]+) \(.*/\1/' | sed -E 's/[[:space:]]+$//')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild \
            -project CyclingCompanion.xcodeproj \
            -scheme CyclingCompanion \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            test
